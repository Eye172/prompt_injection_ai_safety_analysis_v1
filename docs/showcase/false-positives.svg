<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="398" viewBox="0 0 1100 398"><rect width="1100" height="398" fill="#0d1117"/><style>text{font-family:Arial,sans-serif;fill:#e6edf3}.small{font-size:16px;fill:#a5b3c4}</style><text x="40" y="48" font-size="27" font-weight="700">The harder question: what gets blocked by mistake?</text><text x="40" y="78" class="small">False-positive rate on benign trigger-word material · lower is better.</text><text x="40" y="127" font-size="18">EN model · NotInject</text><rect x="360" y="105" width="640" height="31" rx="4" fill="#212c3b"/><rect x="360" y="105" width="313.6" height="31" rx="4" fill="#e7aa67"/><text x="688.6" y="127" font-size="17">49%</text><text x="40" y="203" font-size="18">EN baseline · NotInject</text><rect x="360" y="181" width="640" height="31" rx="4" fill="#212c3b"/><rect x="360" y="181" width="275.2" height="31" rx="4" fill="#8396ad"/><text x="650.2" y="203" font-size="17">43%</text><text x="40" y="279" font-size="18">RU model · separate RU set</text><rect x="360" y="257" width="640" height="31" rx="4" fill="#212c3b"/><rect x="360" y="257" width="19.2" height="31" rx="4" fill="#6ad4cf"/><text x="394.2" y="279" font-size="17">3%</text><text x="40" y="374" class="small">NotInject: 339 English examples. The Russian set is different; 49% vs 3% is not a causal comparison.</text></svg>